{# 404页面模板 - 页面未找到错误 #}

{% extends "base.html" %}

{% block extrahead %}
<style>
    /* 404页面专用样式 - 覆盖基础布局 */
    .vp-layout {
        display: flex;
    }
    
    .vp-sidebar {
        display: none;
    }
    
    .vp-content {
        margin-left: 0;
        width: 100%;
    }
    
    .vp-content-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 24px;
    }
    
    .vp-doc-aside {
        display: none;
    }
    
    .vp-doc-footer {
        display: none;
    }
    
    /* 404错误页面样式 */
    .vp-404-container {
        min-height: calc(100vh - 64px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 64px 24px;
    }
    
    .vp-404-title {
        font-size: 96px;
        font-weight: 700;
        line-height: 1;
        color: var(--vp-c-brand-1);
        margin: 0 0 24px;
        letter-spacing: -2px;
    }
    
    .vp-404-subtitle {
        font-size: 24px;
        font-weight: 600;
        color: var(--vp-c-text-1);
        margin: 0 0 16px;
    }
    
    .vp-404-description {
        font-size: 16px;
        color: var(--vp-c-text-2);
        margin: 0 0 32px;
        max-width: 480px;
        line-height: 1.6;
    }
    
    .vp-404-actions {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
    }
    
    .vp-404-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        border-radius: var(--vp-radius-md);
        transition: all 0.2s ease;
    }
    
    .vp-404-button.primary {
        background-color: var(--vp-c-brand-1);
        color: var(--vp-c-white);
        border: 1px solid var(--vp-c-brand-1);
    }
    
    .vp-404-button.primary:hover {
        background-color: var(--vp-c-brand-2);
        border-color: var(--vp-c-brand-2);
    }
    
    .vp-404-button.secondary {
        background-color: var(--vp-c-bg-soft);
        color: var(--vp-c-text-1);
        border: 1px solid var(--vp-c-divider);
    }
    
    .vp-404-button.secondary:hover {
        background-color: var(--vp-c-gray-soft);
        border-color: var(--vp-c-brand-1);
    }
    
    .vp-404-icon {
        font-size: 64px;
        margin-bottom: 24px;
        opacity: 0.8;
    }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
        .vp-404-title {
            font-size: 72px;
        }
        
        .vp-404-subtitle {
            font-size: 20px;
        }
        
        .vp-404-container {
            min-height: calc(100vh - 56px);
            padding: 48px 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="vp-404-container">
    <div class="vp-404-icon">🔍</div>
    <h1 class="vp-404-title">404</h1>
    <h2 class="vp-404-subtitle">页面未找到</h2>
    <p class="vp-404-description">
        抱歉，您访问的页面不存在或已被移除。<br>
        请检查 URL 是否正确，或使用以下选项继续浏览。
    </p>
    <div class="vp-404-actions">
        <a href="{{ nav.homepage.url|url }}" class="vp-404-button primary">
            返回首页
        </a>
    </div>
</div>
{% endblock %}
