<!-- VitePress 风格导航项模板 -->
{% if nav_item.children %}
    <!-- 有子菜单的项 -->
    <li class="vp-sidebar-item{% if nav_item.active %} active{% endif %}">
        <a href="{{ nav_item.url|url }}" class="vp-sidebar-link">{{ nav_item.title }}</a>
        <ul class="vp-sidebar-children">
            {% for child in nav_item.children %}
                {% set nav_item = child %}
                {% include "nav.html" %}
            {% endfor %}
        </ul>
    </li>
{% else %}
    <!-- 单页项 -->
    <li class="vp-sidebar-item{% if nav_item.active %} active{% endif %}">
        <a href="{{ nav_item.url|url }}" class="vp-sidebar-link">
            {{ nav_item.title }}
        </a>
    </li>
{% endif %}
